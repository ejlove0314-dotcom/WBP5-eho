run_type = "staged_learning"
device = "cpu"
json_out_config = "C:/Temp/reinvent_wbp5/rl_wbp5_out.json"

[parameters]
summary_csv_prefix = "C:/Temp/reinvent_wbp5/rl_report"
use_checkpoint = false

[parameters.logging]
type = "file"
filename = "C:/Temp/reinvent_wbp5/rl_progress.log"

[parameters.diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

[parameters.inception]
smiles = ["CC1=C(C=C(C=C1)NC2=NC=CC(=N2)N3CCC(CC3)NC(=O)C4=CC=CS4)S(=O)(=O)N"]
deduplicate = true
score_lipinski = true

[[stage]]
chkpt_file = "C:/Temp/reinvent_wbp5/rl_checkpoint.chkpt"
max_score = 1.0
min_steps = 50
max_steps = 300

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]

[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"

[stage.scoring.component.custom_alerts.endpoint.params]
smarts = ["[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]"]

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]

[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular Weight"
weight = 1

[stage.scoring.component.MolecularWeight.endpoint.transform]
type = "double_sigmoid"
high = 500.0
low = 200.0
coef_div = 500.0
coef_si = 10.0
coef_se = 10.0

[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]

[[stage.scoring.component.NumAromaticRings.endpoint]]
name = "Aromatic Rings"
weight = 1

[stage.scoring.component.NumAromaticRings.endpoint.transform]
type = "double_sigmoid"
high = 4.0
low = 1.0
coef_div = 4.0
coef_si = 10.0
coef_se = 10.0

[[stage.scoring.component]]
[stage.scoring.component.NumHBD]

[[stage.scoring.component.NumHBD.endpoint]]
name = "H-bond Donors"
weight = 1

[stage.scoring.component.NumHBD.endpoint.transform]
type = "double_sigmoid"
high = 5.0
low = 1.0
coef_div = 5.0
coef_si = 10.0
coef_se = 10.0

[[stage.scoring.component]]
[stage.scoring.component.NumHBA]

[[stage.scoring.component.NumHBA.endpoint]]
name = "H-bond Acceptors"
weight = 1

[stage.scoring.component.NumHBA.endpoint.transform]
type = "double_sigmoid"
high = 10.0
low = 2.0
coef_div = 10.0
coef_si = 10.0
coef_se = 10.0

[[stage.scoring.component]]
[stage.scoring.component.TanimotoSimilarity]

[[stage.scoring.component.TanimotoSimilarity.endpoint]]
name = "Pazopanib Similarity"
weight = 2

[stage.scoring.component.TanimotoSimilarity.endpoint.params]
smiles = ["CC1=C(C=C(C=C1)NC2=NC=CC(=N2)N3CCC(CC3)NC(=O)C4=CC=CS4)S(=O)(=O)N"]
radius = 2
use_counts = true

[stage.scoring.component.TanimotoSimilarity.endpoint.transform]
type = "double_sigmoid"
high = 0.6
low = 0.2
coef_div = 0.6
coef_si = 10.0
coef_se = 10.0
